<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <linearGradient id="afiFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C01A18" />
      <stop offset="50%" stop-color="#E52321" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
    <filter id="afiFlameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- AFI Bold Typography -->
  <g fill="#FFFFFF">
    <!-- Letter A -->
    <path d="M 40,140 L 75,30 L 105,30 L 140,140 L 110,140 L 103,115 L 77,115 L 70,140 Z M 83,92 L 97,92 L 90,55 Z" />
    
    <!-- Letter F -->
    <path d="M 152,30 L 215,30 L 215,54 L 180,54 L 180,76 L 210,76 L 210,100 L 180,100 L 180,140 L 152,140 Z" />
    
    <!-- Letter I Stem -->
    <path d="M 228,60 L 255,60 L 255,140 L 228,140 Z" />
    
    <!-- Red Flame Accent replacing dot of I -->
    <path d="M 241.5,50 C 235,40 238,25 245,15 C 248,22 254,28 252,36 C 255,30 258,22 258,15 C 265,28 260,42 241.5,50 Z" fill="url(#afiFlameGrad)" filter="url(#afiFlameGlow)" />
  </g>

  <!-- Dynamic Flame Graphic on Right Side -->
  <g filter="url(#afiFlameGlow)">
    <!-- Outer Red Flame -->
    <path d="M 275,140 C 275,140 255,100 268,65 C 280,30 310,10 310,10 C 310,10 298,40 310,60 C 322,80 345,55 350,38 C 358,68 340,105 320,122 C 305,135 288,140 275,140 Z" fill="url(#afiFlameGrad)" />
    <!-- Inner White Flame Curve -->
    <path d="M 292,140 C 292,140 282,112 300,90 C 318,68 330,52 330,52 C 330,52 324,76 336,90 C 348,104 342,125 324,136 C 312,142 298,140 292,140 Z" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Tagline: Steaks & Platters in Script -->
  <text x="40" y="185" font-family="'Playfair Display', Georgia, 'Brush Script MT', cursive" font-style="italic" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="1">
    Steaks &amp; Platters
  </text>
</svg>
