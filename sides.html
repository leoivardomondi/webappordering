                </a>
                <span class="nav-brand-x">X</span>
                <a href="events.html" style="display: inline-flex; align-items: center;">
                    <img src="images/afiboardroom (1).png" alt="Afi The Boardroom Emblem" class="nav-brand-logo-2" fetchpriority="high" decoding="async">
                </a>
            </div>
            <input type="checkbox" id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Toggle menu">
            <nav class="nav-links">
                <a href="index.html">HOME</a>
                <a href="menu.html" class="active">MENU</a>
                <a href="index.html#branches">BRANCHES</a>
                <a href="index.html#events">EVENTS &amp; ROOMS</a>
                <a href="index.html#butchery">BUTCHERY</a>

    <section class="page-hero" style="background-image: url('https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80');">
        <div class="hero-overlay"><h1>SIDES &amp; ACCOMPANIMENTS</h1></div>
    </section>

    <main class="menu-content">
        <div class="breadcrumbs">
            <a href="menu.html">MENU</a>
            <span class="separator">&gt;</span>
            <span class="current">SIDES &amp; ACCOMPANIMENTS</span>
        </div>

        <section class="item-grid product-grid">

            <div class="product-item">
                <div class="food-card-img"><img src="https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="TRADITIONAL MUKIMO" loading="lazy" decoding="async"></div>
                <h4>TRADITIONAL MUKIMO</h4>
                <p class="price">KES 220</p>
                <button type="button" class="btn-order js-add-to-cart" data-product-title="Traditional Mukimo" data-product-price="220" data-product-image="https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80">ADD TO CART</button>
            </div>

            <div class="product-item">
                <div class="food-card-img"><img src="https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="MASALA FRENCH FRIES" loading="lazy" decoding="async"></div>
                <h4>MASALA FRENCH FRIES</h4>
                <p class="price">KES 250</p>
                <button type="button" class="btn-order js-add-to-cart" data-product-title="Masala French Fries" data-product-price="250" data-product-image="https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80">ADD TO CART</button>

            <div class="product-item">
                <div class="food-card-img"><img src="https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="STEAMED UGALI" loading="lazy" decoding="async"></div>
                <h4>STEAMED UGALI</h4>
                <p class="price">KES 120</p>
                <button type="button" class="btn-order js-add-to-cart" data-product-title="Steamed Ugali" data-product-price="120" data-product-image="https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80">ADD TO CART</button>
            </div>

            <div class="product-item">
                <div class="food-card-img"><img src="https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="FRESH KACHUMBARI SALAD" loading="lazy" decoding="async"></div>

                <p class="price">KES 150</p>
                <button type="button" class="btn-order js-add-to-cart" data-product-title="Fresh Kachumbari Salad" data-product-price="150" data-product-image="https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80">ADD TO CART</button>
